<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundwork</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #f5f3ee;
  --paper: #fbfaf7;
  --ink: #1e1d1a;
  --ink-2: #57544d;
  --muted: #9b968c;
  --hair: #e4e0d7;
  --accent: #4a6b5d;
  --accent-soft: #dfe7e2;
  --rest: #8aa598;
  --figure: #23221f;
  --prop: #cdc8bd;
  --load: #8f897d;
  --rest-bg: #e7eee9;
  --f-back: #5f8a78; --f-mobility: #8fa99c; --f-core: #6f84ad; --f-upper: #c07a5f; --f-legs: #c09a4a; --f-test: #3b3a36; --f-run: #4f7ea8; --f-rest: #a7a39a;
  --serif: "New York", ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --paper: #1a1a18; --ink: #ecebe6; --ink-2: #bdbab2; --muted: #7c786f; --hair: #2a2926;
    --accent: #9cc2b0; --accent-soft: #23302a; --rest: #6f8a7e; --figure: #e9e7e1; --prop: #4a4843; --load: #8a857b; --rest-bg: #18211d; --f-test: #d9d6cf; --f-run: #7fa6cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --paper: #1a1a18; --ink: #ecebe6; --ink-2: #bdbab2; --muted: #7c786f; --hair: #2a2926;
  --accent: #9cc2b0; --accent-soft: #23302a; --rest: #6f8a7e; --figure: #e9e7e1; --prop: #4a4843; --load: #8a857b; --rest-bg: #18211d; --f-test: #d9d6cf; --f-run: #7fa6cc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; font-weight: 400; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--hair); padding: 6px 2px; border-radius: 0; }
input:focus, select:focus { outline: none; border-bottom-color: var(--ink); }
select { cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* One column width for every page, and the scrollbar's space always reserved, so the top bar
   and content never shift when moving between pages. */
html { scrollbar-gutter: stable; }
.page, .page.narrow { max-width: 800px; margin: 0 auto; padding: 0 32px 96px; box-sizing: border-box; }
@media (max-width: 640px) { .page { padding: 0 16px 64px; } }

/* top bar */
.topbar { display: flex; align-items: center; gap: 36px; padding: 28px 0 8px; }
.wordmark { font-family: var(--serif); font-size: 21px; letter-spacing: .01em; }
.topbar nav { display: flex; gap: 22px; font-size: 14px; }
.topbar nav a { color: var(--muted); padding-bottom: 3px; border-bottom: 1px solid transparent; transition: color .2s; }
.topbar nav a:hover { color: var(--ink); }
.topbar nav a.on { color: var(--ink); border-bottom-color: var(--ink); }
.loc { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.loc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.loc-select { border: 0; padding: 2px; }
@media (max-width: 640px) { .topbar { flex-wrap: wrap; gap: 14px 22px; } }

/* type */
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--serif); font-size: clamp(44px, 6vw, 76px); line-height: 1.02; letter-spacing: -.015em; margin: 14px 0 12px; }
.display.small { font-size: clamp(36px, 4.5vw, 52px); }
.lede { color: var(--ink-2); font-size: 17px; margin: 0; }
.page-head { padding: 48px 0 24px; }

/* hero */
.hero { padding: 72px 0 64px; border-bottom: 1px solid var(--hair); margin-bottom: 48px; }
.hero.compact { padding: 48px 0 36px; margin-bottom: 24px; }
.hero-actions { display: flex; align-items: center; gap: 24px; margin-top: 32px; flex-wrap: wrap; }
.begin { display: inline-flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 15px 30px 15px 24px; font-size: 16px; letter-spacing: .01em; cursor: pointer; transition: transform .15s ease, opacity .2s; }
.begin:hover { transform: translateY(-1px); }
.begin.small { padding: 10px 22px; font-size: 14px; margin-top: 18px; }
.begin-icon { width: 0; height: 0; border-left: 10px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.done-mark { color: var(--accent); font-size: 14px; }
.also { margin-top: 28px; display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }
.also a { border-bottom: 1px solid var(--hair); }
.also a.is-done { color: var(--muted); text-decoration: line-through; }
.swaps { color: var(--ink-2); font-size: 14px; margin: 20px 0 0; }

/* sections */

.section { margin-bottom: 56px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--hair); margin-bottom: 8px; }
.section-head h2 { font-family: var(--serif); font-size: 22px; }
.quiet { background: none; border: 0; padding: 0; color: var(--ink-2); font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--hair); }
.quiet:hover { color: var(--ink); border-bottom-color: var(--ink); }
.quiet.danger { color: #a4553f; }
.btn { display: inline-flex; align-items: center; border: 1px solid var(--hair); background: var(--paper); border-radius: 999px; padding: 9px 20px; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* session rows */
.row { display: flex; align-items: center; border-bottom: 1px solid var(--hair); }
.row-main { flex: 1; display: flex; align-items: baseline; gap: 18px; padding: 14px 0; min-width: 0; }
.row-title { font-family: var(--serif); font-size: 19px; }
.row-meta { color: var(--muted); font-size: 13px; }
.row-go { color: var(--muted); transition: transform .2s, color .2s; padding: 0 8px; }
.row-main:hover .row-go { transform: translateX(4px); color: var(--ink); }
.row-edit { color: var(--muted); font-size: 13px; padding: 4px 0 4px 12px; opacity: 0; transition: opacity .2s; }
.row:hover .row-edit { opacity: 1; }
@media (hover: none) { .row-edit { opacity: 1; } }
.media.row-thumb, div.row-thumb { width: 76px; flex: none; }

/* figures */
.media { position: relative; width: 100%; aspect-ratio: 16 / 10; }
.media svg, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.media.is-video video { mix-blend-mode: multiply; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 999px; padding: 2px; }
.seg button { background: none; border: 0; border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--muted); cursor: pointer; height: auto; min-width: 0; }
.seg button.on { background: var(--ink); color: var(--bg); }
.p-controls .seg { margin-left: 10px; }
.p-controls .seg button { border: 0; height: 34px; }
.fig { color: var(--figure); overflow: hidden; }
.fg-body { fill: currentColor; }
.fg-farg { opacity: .24; }
.fg-eye { fill: var(--bg); }
.fg-shadow { fill: currentColor; opacity: .07; }
.fg-floor { stroke: var(--hair); stroke-width: 1; }
.pf-pad { fill: var(--prop); }
.pf-top { stroke: var(--prop); stroke-width: 6; stroke-linecap: round; }
.pf-leg, .pf-rail { stroke: var(--prop); stroke-width: 2.5; stroke-linecap: round; }
.pf-load { fill: var(--load); }
.pf-plate { fill: none; stroke: var(--bg); stroke-width: 1; opacity: .5; }
.pf-hub, .pf-dot { fill: var(--bg); }
.pf-handle { fill: none; stroke: var(--load); stroke-width: 2.6; stroke-linecap: round; }

/* Studio illustrations: flat cut-paper shapes, warm surfaces and restrained tonal depth. */
.media.is-studio {
  --st-skin: #6b8474; --st-top: #374f45; --st-short: #263b33; --st-leg: #5d7868;
  --st-far: #9ea99a; --st-far-short: #7a8e7e; --st-hair: #2b4037;
  --st-sock: #d9d7c4; --st-shoe: #3c5045; --st-weight: #b67f60;
  --st-halo: #e6e9dd; --st-mat: #d9ded0; --st-ground: #c0c9b8;
  background: #f0f1e9; border-radius: 16px; overflow: hidden;
}
.fig-studio { isolation: isolate; }
.st-skin { fill: var(--st-skin); }
.st-top { fill: var(--st-top); }
.st-short { fill: var(--st-short); }
.st-leg { fill: var(--st-leg); }
.st-far { fill: var(--st-far); }
.st-far-short { fill: var(--st-far-short); }
.st-far-sock { fill: var(--st-far); }
.st-far-shoe { fill: var(--st-far-short); }
.st-hair { fill: var(--st-hair); }
.st-sock { fill: var(--st-sock); }
.st-shoe { fill: var(--st-shoe); }
.st-sole { fill: none; stroke: var(--st-sock); stroke-width: .9; stroke-linecap: round; }
.st-ear { fill: none; stroke: var(--st-hair); stroke-width: .6; opacity: .45; }
.st-glint { fill: #e8eedb; opacity: .13; }
.st-seam { fill: none; stroke: #b4c7b1; stroke-width: .7; stroke-linecap: round; opacity: .35; }
.st-label { fill: none; stroke: #dbab7f; stroke-width: 1.6; stroke-linecap: round; }
.st-halo { fill: var(--st-halo); }
.st-mat { fill: var(--st-mat); }
.st-ground { fill: none; stroke: var(--st-ground); stroke-width: .6; }
.st-hidden { display: none; }
.st-weight { fill: var(--st-weight); }
.st-weight-ring { fill: none; stroke: #f2d8bd; stroke-width: .8; opacity: .5; }
.st-weight-hole { fill: var(--st-short); }
.st-handle { fill: none; stroke: var(--st-weight); stroke-width: 2.5; }
.st-weight-glint { fill: none; stroke: #f2d8bd; stroke-width: 1; stroke-linecap: round; opacity: .5; }
.st-props .pf-pad { fill: #a7ad98; }
.st-props .pf-leg, .st-props .pf-rail, .st-props .pf-top { stroke: #a7ad98; }
.motion-toolbar { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 6px 0 28px; padding: 22px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.motion-title { font-family: var(--serif); font-size: 23px; }
.motion-toolbar p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.demo-toggle { flex-shrink: 0; }
.demo-toggle button { padding: 8px 16px; }
.demo-toggle button.on { background: var(--accent); color: var(--bg); }
.demo-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.library-hint { color: var(--muted); font-size: 12px; margin: -12px 0 22px; }
.p-controls { flex-wrap: wrap; align-items: center; }
.p-controls .demo-toggle button.on { color: var(--bg); }
.p-foot { gap: 18px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .motion-toolbar { align-items: flex-start; flex-direction: column; gap: 14px; }
  .lib { grid-template-columns: minmax(0, 1fr); }
  .p-controls .seg { margin-left: 0; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .media.is-studio {
    --st-skin: #a6bba1; --st-top: #708b75; --st-short: #4e6857; --st-leg: #94ad94;
    --st-far: #556958; --st-far-short: #405746; --st-hair: #3a5142;
    --st-sock: #d5d7bd; --st-shoe: #6c836c; --st-weight: #c89471;
    --st-halo: #29352b; --st-mat: #354336; --st-ground: #4c5d49;
    background: #212a23;
  }
}
:root[data-theme="dark"] .media.is-studio {
  --st-skin: #a6bba1; --st-top: #708b75; --st-short: #4e6857; --st-leg: #94ad94;
  --st-far: #556958; --st-far-short: #405746; --st-hair: #3a5142;
  --st-sock: #d5d7bd; --st-shoe: #6c836c; --st-weight: #c89471;
  --st-halo: #29352b; --st-mat: #354336; --st-ground: #4c5d49; background: #212a23;
}


@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .media.is-video { background: #fff; border-radius: 14px; overflow: hidden; }
  :root:not([data-theme="light"]) .media.is-video video, :root:not([data-theme="light"]) .media.is-video img { mix-blend-mode: normal; }
}
:root[data-theme="dark"] .media.is-video { background: #fff; border-radius: 14px; overflow: hidden; }
:root[data-theme="dark"] .media.is-video video, :root[data-theme="dark"] .media.is-video img { mix-blend-mode: normal; }

/* library */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
.pill { border: 1px solid var(--hair); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.pill:hover { border-color: var(--ink-2); }
.pill.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.switch { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px 32px; }
.tile-media { background: var(--paper); border-radius: 10px; }
.tile-body { padding: 14px 2px 0; }
.tile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tile-head h3 { font-family: var(--serif); font-size: 20px; }
.tile-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tile.unavailable .tile-media { opacity: .45; }
.cues { margin: 10px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; }
.cues li { padding: 3px 0 3px 16px; position: relative; }
.cues li::before { content: ''; position: absolute; left: 2px; top: 13px; width: 6px; height: 1px; background: var(--muted); }

/* settings */
.loc-card { padding: 20px 0 8px; border-bottom: 1px solid var(--hair); }
.loc-card-head { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.loc-name { font-family: var(--serif); font-size: 20px; border-bottom-color: transparent; width: 220px; }
.loc-name:hover { border-bottom-color: var(--hair); }
.tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 20px; }
.check { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; font-size: 14.5px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.row-check { border-bottom: 1px solid var(--hair); padding: 12px 0; }

/* editor */
.display-input { font-family: var(--serif); font-size: clamp(36px, 4.5vw, 52px); border-bottom-color: transparent; width: 100%; padding: 0; }
.display-input:hover { border-bottom-color: var(--hair); }
.eblock { padding: 24px 0; border-top: 1px solid var(--hair); }
.eblock-head { display: flex; gap: 20px; align-items: end; flex-wrap: wrap; margin-bottom: 8px; }
.eblock-name { font-family: var(--serif); font-size: 22px; min-width: 200px; }
.erow { padding: 14px 0; border-bottom: 1px dashed var(--hair); }
.erow-main { display: flex; gap: 14px; align-items: center; }
.media.erow-thumb { width: 64px; flex: none; }
.ex-sel { font-family: var(--serif); font-size: 18px; min-width: 240px; }
.erow-fields { display: flex; gap: 16px; flex-wrap: wrap; padding: 6px 0 0 78px; }
.fld { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.fld input, .fld select { width: 96px; font-size: 14px; }
.fld.wide input { width: 220px; }
.erow-btns { margin-left: auto; display: flex; gap: 2px; }
.icon { background: none; border: 0; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 16px; }
.icon:hover { background: var(--paper); color: var(--ink); }
.savebar { position: sticky; bottom: 0; display: flex; gap: 18px; align-items: center; padding: 18px 0; background: var(--bg); border-top: 1px solid var(--hair); margin-top: 24px; }
@media (max-width: 640px) { .erow-fields { padding-left: 0; } .ex-sel { min-width: 0; flex: 1; } }

/* pre-start overview */
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 0 40px; }
.ov { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.ov-n { font-family: var(--serif); color: var(--muted); font-size: 14px; width: 20px; }
.media.ov-thumb { width: 72px; flex: none; }
.ov-title { font-family: var(--serif); font-size: 17px; }
.ov-meta { color: var(--muted); font-size: 12.5px; }

/* player */
.player { position: fixed; inset: 0; background: var(--bg); display: grid; grid-template-rows: auto auto 1fr auto; overflow: auto; }
.p-progress { height: 2px; background: var(--hair); }
.p-progress i { display: block; height: 100%; background: var(--ink); transition: width .6s ease; }
.p-top { display: flex; align-items: center; gap: 24px; padding: 20px 40px; font-size: 14px; transition: opacity .6s; }
.p-crumb { font-family: var(--serif); font-size: 16px; }
.p-top #premain { margin-left: auto; font-variant-numeric: tabular-nums; }
.p-close { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 4px; }
.p-close:hover { color: var(--ink); }
.p-stage { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 56px; align-items: center; padding: 0 56px; min-height: 0; }
.p-figure { display: flex; align-items: center; justify-content: center; min-height: 0; }
.p-media { max-height: 74vh; }
.is-rest .p-figure { opacity: .55; transition: opacity .5s; }
.p-kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-height: 18px; }
.is-rest .p-kicker { color: var(--rest); }
.p-title { font-family: var(--serif); font-size: clamp(34px, 3.6vw, 54px); line-height: 1.05; margin: 10px 0 8px; letter-spacing: -.01em; }
.p-title em { font-style: italic; color: var(--ink-2); font-size: .72em; }
.p-target { color: var(--ink-2); font-size: 17px; min-height: 26px; }
.p-ring { position: relative; width: min(260px, 32vh); aspect-ratio: 1; margin: 26px 0 8px; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring-track { fill: none; stroke: var(--hair); stroke-width: 1.5; }
.ring-arc { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset .12s linear; }
.is-rest .ring-arc, .is-relax .ring-arc { stroke: var(--rest); }
.p-num-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.p-num { font-family: var(--sans); font-weight: 200; font-size: min(92px, 11vh); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.p-sub { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: lowercase; margin-top: 6px; min-height: 18px; }
.p-cues { list-style: none; padding: 0; margin: 18px 0 0; color: var(--ink-2); font-size: 15px; }
.p-cues li { padding: 4px 0 4px 18px; position: relative; }
.p-cues li::before { content: ''; position: absolute; left: 2px; top: 15px; width: 8px; height: 1px; background: var(--muted); }
.p-note, .p-swap { font-size: 14px; color: var(--accent); margin: 14px 0 0; }
.p-swap { color: var(--muted); font-style: italic; font-family: var(--serif); }
.p-foot { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px 26px; transition: opacity .6s; }
.p-controls { display: flex; gap: 6px; }
.p-controls button { background: none; border: 1px solid var(--hair); border-radius: 999px; min-width: 44px; height: 40px; padding: 0 16px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.p-controls button:hover { border-color: var(--ink-2); color: var(--ink); }
.p-next { font-family: var(--serif); font-size: 16px; }
.player.idle .p-top, .player.idle .p-foot { opacity: .18; }
.player.idle { cursor: none; }
.player.paused .p-num { opacity: .3; }
.player.paused .p-kicker::after { content: '  ·  paused'; color: var(--ink); }
@media (max-width: 860px) {
  .p-stage { grid-template-columns: 1fr; gap: 8px; padding: 12px 16px; min-height: auto; }
  .p-top, .p-foot { padding-left: 16px; padding-right: 16px; }
  .p-ring { width: 180px; }
}


/* plan calendar */
.cal-dow, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 6px 6px; }
.cday { all: unset; box-sizing: border-box; cursor: pointer; min-height: 84px; padding: 8px; border-radius: 8px; background: var(--paper); display: flex; flex-direction: column; gap: 3px; font-size: 12px; min-width: 0; overflow: hidden; transition: box-shadow .15s; }
.cday:hover { box-shadow: inset 0 0 0 1px var(--hair); }
.cday.empty { background: transparent; }
.cday.past { opacity: .55; }
.cday.today { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--ink); }
.cday.sel:not(.today) { opacity: 1; box-shadow: inset 0 0 0 1px var(--ink-2); }
.c-n { font-family: var(--serif); font-size: 15px; }
.c-run { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-ran { color: var(--accent); }
.c-race { color: var(--accent); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.c-str { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; color: var(--muted); font-size: 11px; }
.c-str .is-done { color: var(--accent); }
.c-str .is-done::before { content: '✓'; }
.also-link { color: var(--ink-2); border-bottom: 1px solid var(--hair); font-size: 15px; }
.also-link.is-done { color: var(--muted); text-decoration: line-through; }
.actual { color: var(--accent); font-size: 14px; }
.day-line { margin: 18px 0 0; font-size: 16px; }
.day-line + .day-line { margin-top: 6px; }
.row-code { font-size: 12px; color: var(--muted); width: 64px; flex: none; }
.row-main .row-title { flex: 1; }
.row-main .row-meta { margin-left: auto; }
@media (max-width: 640px) { .cday { min-height: 64px; padding: 5px; font-size: 10.5px; } .c-n { font-size: 13px; } }
.search { width: 220px; margin-right: 8px; font-size: 14px; }
.more { display: flex; justify-content: center; margin-top: 40px; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.media.is-video img { mix-blend-mode: multiply; }
.finish-note { margin-top: 28px; }
.note-input { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; resize: vertical; }
.note-input:focus { outline: none; border-color: var(--ink-2); }
@media (max-width: 640px) { .day-row { grid-template-columns: 44px 1fr; } .dr-strength { grid-column: 2; } }


/* home views */
body.snap { scroll-snap-type: y proximity; }
.home .view { min-height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; }
.view-today { position: relative; padding-bottom: 40px; }
.art { position: relative; height: 38vh; min-height: 220px; border-radius: 16px; overflow: hidden; margin: 8px 0 40px; cursor: pointer; transition: opacity .25s; background: var(--paper); }
.art.fade { opacity: .2; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.today-panel .display { margin-top: 10px; }
.scroll-hint { margin-top: auto; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding-top: 32px; }
.scroll-hint span { font-size: 16px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
.view-calendar { padding-top: 40px; }
.day-detail { padding: 28px 0 0; }
.day-detail .display.small { margin: 8px 0 6px; }

/* calendar visuals */
.cday { gap: 6px; }
.c-top { display: flex; justify-content: space-between; align-items: center; }
.c-flag { width: 9px; height: 9px; background: var(--accent); clip-path: polygon(0 0, 100% 30%, 0 60%); }
.c-runbar { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-2); min-width: 0; }
.c-runbar i { display: block; height: 3px; border-radius: 2px; background: var(--ink-2); opacity: .35; }
.c-runbar.done i { background: var(--accent); opacity: 1; }
.c-runbar.done { color: var(--accent); }
.c-runbar.race i { background: var(--accent); opacity: .8; height: 4px; }
.c-runbar.race span { color: var(--accent); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.c-runbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-dots { display: flex; gap: 5px; margin-top: auto; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--dc); flex: none; vertical-align: middle; }
.dot.done { background: var(--dc); }
.f-back { --dc: var(--f-back); } .f-mobility { --dc: var(--f-mobility); } .f-core { --dc: var(--f-core); }
.f-upper { --dc: var(--f-upper); } .f-legs { --dc: var(--f-legs); } .f-test { --dc: var(--f-test); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-top: 18px; font-size: 12px; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend-bar { width: 22px; }
.legend-bar i { opacity: .6; }
.row-main .dot { align-self: center; }

/* pre-session overview */
.pre-head { padding: 40px 0 8px; }
.stats { display: flex; gap: 44px; margin: 22px 0 22px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat-n { font-weight: 200; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
.timeline { display: flex; height: 10px; gap: 2px; border-radius: 5px; overflow: hidden; }
.timeline i { min-width: 2px; }
.tl-work { background: var(--dc); }
.tl-rest { background: var(--hair); }
.ov-block { margin-top: 36px; }
.ov-block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.ov-block-head h3 { font-family: var(--serif); font-size: 21px; }
.ov-block-head .muted { font-size: 13px; }
.ov-item { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.media.ov-thumb { width: 84px; }
.ov-title { font-family: var(--serif); font-size: 18px; }
.ov-meta { color: var(--muted); font-size: 13px; }
.ov-amount { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.ov-big { font-weight: 300; font-size: 24px; font-variant-numeric: tabular-nums; }
.ov-tags { color: var(--muted); font-size: 12px; }

/* player rest state */
.player { transition: background-color .5s ease; }
.player.is-rest { background: var(--rest-bg); }
.p-rest-title { color: var(--rest); }
.p-upnext { font-size: 19px; font-family: var(--serif); margin-top: 4px; }
.p-upnext em { font-style: italic; color: var(--ink-2); }
.is-rest .p-num { color: var(--rest); }
.is-rest .ring-arc { stroke-width: 4; }
.is-rest .p-figure { opacity: .5; }

/* rating */
.rating { margin-top: 30px; display: flex; flex-direction: column; gap: 22px; }
.rate-row { display: flex; flex-direction: column; gap: 10px; }
.rate-scale { display: flex; gap: 6px; flex-wrap: wrap; }
.rate-n { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--hair); background: transparent; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.rate-n:hover { border-color: var(--ink-2); }
.rate-n.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.rate-label { font-size: 14px; color: var(--ink-2); }
.rate-feel { display: flex; gap: 8px; flex-wrap: wrap; }

/* location configurator */
.loc-card { padding: 22px 22px 18px; border: 1px solid var(--hair); border-radius: 14px; margin-top: 14px; background: var(--paper); }
.loc-card.is-default { border-color: var(--ink-2); }
.loc-card-head { display: flex; align-items: center; gap: 16px; margin-bottom: 2px; flex-wrap: wrap; }
.loc-actions { margin-left: auto; display: flex; gap: 16px; }
.eq-group { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: baseline; margin-top: 14px; }
.eq-group-name { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.eq-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.eq-chip { border: 1px solid var(--hair); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s; }
.eq-chip:hover { border-color: var(--ink-2); }
.eq-chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
@media (max-width: 640px) { .eq-group { grid-template-columns: 1fr; gap: 6px; } .ov-item { grid-template-columns: 64px 1fr; } .ov-amount { grid-column: 2; align-items: flex-start; text-align: left; } }


/* fullscreen home */
.home-full { position: relative; min-height: 100vh; overflow: hidden; }
.art-full { position: fixed; inset: 0; cursor: pointer; transition: opacity .3s; }
.art-full.fade { opacity: .25; }
.art-full svg { width: 100%; height: 100%; display: block; }
.home-scrim { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent) 0%, transparent 18%, transparent 42%, color-mix(in srgb, var(--bg) 82%, transparent) 70%, var(--bg) 100%); }
.home-content { position: relative; min-height: 100vh; display: flex; flex-direction: column; pointer-events: none; }
.home-content > * { pointer-events: auto; }
.home-content > .page { width: 100%; }
.home-content > .page.home-today { margin-top: auto; }
.home-content .topbar { pointer-events: auto; }
.home-today { margin-top: auto; width: 100%; padding-bottom: 8vh; }
.home-today .today-panel { pointer-events: auto; }
.home-cal-link { display: inline-block; margin-top: 28px; }

.home-full.pal-night .home-scrim, .home-full.pal-dusk .home-scrim { background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 70%, transparent) 0%, transparent 22%, transparent 34%, color-mix(in srgb, var(--bg) 94%, transparent) 56%, var(--bg) 78%); }

/* calendar page */
.cal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.c-icons { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }
.c-item { display: inline-flex; align-items: center; gap: 2px; border-radius: 999px; }
.ico { display: inline-flex; width: 28px; height: 28px; color: var(--dc, var(--ink-2)); border-radius: 50%; flex: none; }
.ico svg { width: 100%; height: 100%; padding: 2px; }
.c-item.done .ico { background: var(--dc, var(--ink-2)); color: var(--paper); }
.f-run { --dc: var(--ink-2); }
.c-item.done .f-run { --dc: var(--accent); }
.c-item.is-race .ico { color: var(--accent); }
.c-item.is-race.done .ico { background: var(--accent); color: var(--paper); }
.c-km { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.c-item.done .c-km { color: var(--accent); }
.c-item.rest .ico { color: var(--muted); opacity: .6; }
.c-race { font-size: 10.5px; color: var(--accent); font-weight: 600; line-height: 1.2; margin-top: auto; overflow-wrap: anywhere; }
.cday { min-height: 100px; }
.legend .ico { width: 20px; height: 20px; }
@media (max-width: 640px) { .ico { width: 18px; height: 18px; } .c-km { font-size: 10px; } }


/* phone */
@media (max-width: 640px) {
  .topbar { position: relative; padding-top: 18px; }
  .topbar nav { gap: 16px; font-size: 13.5px; width: 100%; overflow-x: auto; scrollbar-width: none; }
  .topbar nav::-webkit-scrollbar { display: none; }
  .loc { position: absolute; right: 0; top: 20px; }
  .cal-dow, .cal { gap: 3px; }
  .cday { min-height: 78px; padding: 5px 4px; border-radius: 6px; }
  .c-race { display: none; }
  .c-icons { gap: 2px; }
  .ico { width: 20px; height: 20px; }
  .c-km { font-size: 10px; }
  .cal-dow span { padding: 8px 2px 4px; font-size: 10px; }
  .home-today { padding-bottom: 5vh; }
  .display { font-size: 42px; }
  .stats { gap: 24px; }
  .stat-n { font-size: 30px; }
  .p-stage { padding: 0 16px; }
  .p-ring { width: 170px; margin: 14px 0 4px; }
  .p-title { font-size: 30px; }
}


/* badges (Garmin-style): outlined = planned, filled = done */
.ico { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; flex: none; color: var(--dc, var(--ink-2)); box-shadow: inset 0 0 0 1.5px var(--dc, var(--ink-2)); background: transparent; }
.ico svg { width: 60%; height: 60%; padding: 0; fill: currentColor; }
.ico.filled { background: var(--dc); color: var(--paper); box-shadow: none; }
.f-run { --dc: var(--f-run); } .f-rest { --dc: var(--f-rest); } .f-strength { --dc: var(--f-upper); }
.c-icons { gap: 4px; }
.c-item { gap: 3px; }
.c-km { font-size: 11.5px; color: var(--ink-2); }
.c-item.rest .ico { opacity: .55; box-shadow: none; }
.legend .ico { width: 22px; height: 22px; }

/* activities: runs and routines share one card */
.act { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--paper); margin-top: 8px; }
.act .ico { width: 40px; height: 40px; }
.act-title { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
.act-meta { color: var(--muted); font-size: 13px; }
.act-go { font-size: 14px; color: var(--ink); border-bottom: 1px solid var(--hair); white-space: nowrap; }
.act-go:hover { border-bottom-color: var(--ink); }
.act-result { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.act-result.done { color: var(--accent); }
.act.rest { background: transparent; padding-left: 14px; }
.act.rest .act-title { color: var(--muted); font-size: 16px; }

/* agenda */
.agenda-title { font-family: var(--serif); font-size: 24px; margin: 48px 0 6px; }
.ag-day { padding: 18px 0 14px; border-top: 1px solid var(--hair); scroll-margin-top: 16px; }
.ag-head { display: flex; gap: 10px; align-items: baseline; }
.ag-date { font-family: var(--serif); font-size: 19px; }
.ag-day.today .ag-date::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 8px; vertical-align: middle; }
.ag-day.sel { animation: flash 1.6s ease; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.ag-note { color: var(--muted); font-size: 13.5px; margin: 8px 0 0 2px; }

/* home */
.quote { min-height: 46px; transition: opacity .45s ease; }
.quote.out { opacity: 0; }
.quote .q { display: block; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--ink-2); }
.quote .q-who { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.today-acts { margin-top: 22px; max-width: 520px; }
.today-acts .act { background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(6px); }
.home-full.mood-night .home-scrim, .home-full.mood-dusk .home-scrim { background: linear-gradient(180deg, rgba(10,12,18,.35) 0%, transparent 20%, transparent 36%, color-mix(in srgb, var(--bg) 94%, transparent) 58%, var(--bg) 80%); }
.home-full.mood-night .topbar, .home-full.mood-dusk .topbar { color: #f1efe9; }
.home-full.mood-night .topbar nav a, .home-full.mood-dusk .topbar nav a { color: rgba(241,239,233,.72); }
.home-full.mood-night .topbar nav a.on, .home-full.mood-dusk .topbar nav a.on { color: #fff; border-bottom-color: #fff; }

/* location picker on the routine overview */
.loc-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 4px; font-size: 14px; }
.loc-pick .muted { margin-right: 4px; }
@media (max-width: 640px) { .act { grid-template-columns: 34px 1fr; } .act .ico { width: 34px; height: 34px; } .act-go, .act-result { grid-column: 2; } .ico { width: 24px; height: 24px; } }


/* sky motion: slow and subtle */
.art-full .drift { animation: drift linear infinite alternate; }
@keyframes drift { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
.art-full .twinkle { animation: twinkle ease-in-out infinite alternate; }
@keyframes twinkle { from { fill-opacity: .2; } to { fill-opacity: 1; } }
.art-full .breathe { animation: breathe 18s ease-in-out infinite alternate; }
@keyframes breathe { from { opacity: .55; transform: translateY(0); } to { opacity: 1; transform: translateY(-6px); } }
.art-full .rainfall { animation: rainfall 1.6s linear infinite; }
@keyframes rainfall { from { transform: translate(0, -40px); } to { transform: translate(-11px, 40px); } }
.art-full .snowfall { animation: snowfall 14s linear infinite; }
@keyframes snowfall { from { transform: translate(0, -30px); } to { transform: translate(-20px, 30px); } }
@media (prefers-reduced-motion: reduce) { .art-full * { animation: none !important; } }

.loc-mini select { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-2); border: 0; border-bottom: 1px dotted var(--muted); padding: 0 2px; background: transparent; cursor: pointer; }
.loc-mini select:hover { color: var(--ink); }

.hero-acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 24px; }
.hero-act { display: flex; flex-direction: column; gap: 6px; padding: 20px 22px 22px; border-radius: 16px; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(8px); }
.hero-act-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.hero-act-top .ico { width: 40px; height: 40px; }
.hero-act-kind { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hero-act-title { font-family: var(--serif); font-size: 32px; line-height: 1.1; }
.hero-act-sub { color: var(--ink-2); font-size: 15px; min-height: 22px; }
.hero-act .begin.small { align-self: flex-start; margin-top: 14px; }
.hero-act-foot { margin-top: auto; padding-top: 14px; font-size: 12.5px; color: var(--muted); }
.hero-act.is-done .hero-act-title { color: var(--accent); }

/* finish */
.log { margin-top: 8px; }
.log-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
.log-row.skipped { color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script src="art.js"></script>
<script src="icons.js"></script>
<script src="exercises.js"></script>
<script src="workouts.js"></script>
<script src="app.js"></script>
</body>
