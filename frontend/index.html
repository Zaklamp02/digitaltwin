<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <script>
      (function () {
        var themeMode = "system";
        var dark = false;

        function readStoredThemeMode() {
          try {
            var stored = localStorage.getItem("themeMode");
            if (stored === "light" || stored === "dark" || stored === "system") {
              return stored;
            }

            var legacy = localStorage.getItem("darkMode");
            if (legacy === "true") return "dark";
            if (legacy === "false") return "light";
          } catch (_e) {
            return "system";
          }

          return "system";
        }

        try {
          themeMode = readStoredThemeMode();
          if (themeMode === "dark") {
            dark = true;
          } else if (themeMode === "light") {
            dark = false;
          } else if (window.matchMedia) {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
        } catch (_e) {
          if (window.matchMedia) {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
        }

        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";

        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", dark ? "#030712" : "#fbfbf9");
        }
      })();
    </script>
    <title>Sebastiaan's agent</title>
  </head>
  <body class="bg-paper text-ink dark:bg-gray-950 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
